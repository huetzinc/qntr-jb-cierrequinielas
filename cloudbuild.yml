options:
  logging: CLOUD_LOGGING_ONLY
  default_logs_bucket_behavior: REGIONAL_USER_OWNED_BUCKET

steps:
  # Paso 1: Compilar el .jar con Maven usando la imagen correcta
  - name: "maven:3.9.4-eclipse-temurin-21"
    entrypoint: "mvn"
    args: ["clean", "package"]

  # Paso 2: Construir la imagen Docker usando el .jar generado
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/qntr-jb-cierrequiniela", "."]

  # Paso 3: Enviar la imagen a Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/qntr-jb-cierrequiniela"]

images:
  - "gcr.io/$PROJECT_ID/qntr-jb-cierrequiniela"